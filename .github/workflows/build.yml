name: Build LineageOS 19.1 for Motorola One Deen

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Remove previous build output before compiling"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - lineage-19.1
    paths:
      - ".github/workflows/build.yml"
      - "ROM_BUILD.md"
      - "scripts/build-lineage19.sh"
      - "scripts/stage-kernel.sh"
      - "lineage_deen.mk"
      - "BoardConfig.mk"
      - "device.mk"
      - "lineage.dependencies"

permissions:
  contents: read

concurrency:
  group: deen-lineage19-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile LineageOS 19.1 (deen)
    # Optional repository variable DEEN_RUNNER_LABELS may be a JSON string/array of runner labels.
    runs-on: ${{ vars.DEEN_RUNNER_LABELS != '' && fromJSON(vars.DEEN_RUNNER_LABELS) || 'ubuntu-22.04' }}
    timeout-minutes: 350
    env:
      USE_CCACHE: "1"
      CCACHE_EXEC: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      ANDROID_JOBS: "2"

    steps:
      # Must precede checkout: this action remounts the workspace volume.
      - name: Maximize available build disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 128
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          overprovision-lvm: "true"

      - name: Inspect runner resources and require split-volume capacity
        shell: bash
        run: |
          set -euo pipefail
          df -hT
          free -h
          nproc
          workspace_kib="$(df --output=avail "$GITHUB_WORKSPACE" | awk 'NR==2 {print $1}')"
          temp_kib="$(df --output=avail "$RUNNER_TEMP" | awk 'NR==2 {print $1}')"
          workspace_device="$(df --output=source "$GITHUB_WORKSPACE" | awk 'NR==2 {print $1}')"
          temp_device="$(df --output=source "$RUNNER_TEMP" | awk 'NR==2 {print $1}')"
          combined_kib=$((workspace_kib + temp_kib))
          combined_gib=$((combined_kib / 1024 / 1024))
          workspace_gib=$((workspace_kib / 1024 / 1024))
          temp_gib=$((temp_kib / 1024 / 1024))
          echo "Workspace free: ${workspace_gib} GiB on ${workspace_device}"
          echo "Runner-temp free: ${temp_gib} GiB on ${temp_device}"
          echo "Combined free storage: ${combined_gib} GiB"
          if [[ "$workspace_device" == "$temp_device" ]]; then
            echo "::error::GITHUB_WORKSPACE and RUNNER_TEMP are on the same filesystem; the split-volume Android layout cannot increase usable capacity."
            exit 1
          fi
          # With 8 GiB swap, the runner is expected to expose roughly 194 GiB
          # across the two build filesystems after filesystem overhead. Keep a
          # conservative 190 GiB combined floor and 70 GiB per filesystem.
          if (( workspace_kib < 70 * 1024 * 1024 || temp_kib < 70 * 1024 * 1024 || combined_kib < 190 * 1024 * 1024 )); then
            echo "::error::Insufficient split-volume capacity. Need >=70 GiB on each filesystem and >=190 GiB combined before syncing LineageOS."
            exit 1
          fi

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          ref: lineage-19.1
          fetch-depth: 1

      - name: Prepare split-volume Android source layout
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_TOP="$RUNNER_TEMP/android"
          repo_metadata="$GITHUB_WORKSPACE/.repo"
          mkdir -p "$ANDROID_TOP" "$repo_metadata" "$ANDROID_TOP/.repo"
          if find "$repo_metadata" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "::error::Refusing to mount over a non-empty .repo metadata directory."
            exit 1
          fi
          workspace_device="$(df --output=source "$GITHUB_WORKSPACE" | awk 'NR==2 {print $1}')"
          android_device="$(df --output=source "$ANDROID_TOP" | awk 'NR==2 {print $1}')"
          if [[ "$workspace_device" == "$android_device" ]]; then
            echo "::error::Android worktree and .repo metadata must be on separate filesystems."
            exit 1
          fi
          sudo mount --bind "$repo_metadata" "$ANDROID_TOP/.repo"
          mountpoint -q "$ANDROID_TOP/.repo"
          echo "ANDROID_TOP=$ANDROID_TOP" >> "$GITHUB_ENV"
          echo "Android worktree volume:"
          df -hT "$ANDROID_TOP"
          echo "Repo metadata volume:"
          df -hT "$ANDROID_TOP/.repo"

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils \
            lld lzop pahole perl cpio jq pngcrush rsync schedtool squashfs-tools unzip xsltproc zip \
            zlib1g-dev python3 python-is-python3
          git lfs install

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl --fail --silent --show-error --location https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: deen-lineage19-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            deen-lineage19-ccache-${{ runner.os }}-${{ github.ref_name }}-
            deen-lineage19-ccache-${{ runner.os }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --show-config

      - name: Initialize LineageOS source using shallow sync
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_TOP"
          repo init -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 --depth=1 --git-lfs
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/deen.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="deen-github" fetch="https://github.com/" />
            <project name="isabe8499-oss/device_motorola_deen-22" path="device/motorola/deen" remote="deen-github" revision="lineage-19.1" />
            <project name="Vhmit/vendor_motorola_deen" path="vendor/motorola/deen" remote="deen-github" revision="lineage-19.1" />
          </manifest>
          XML
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse(".repo/local_manifests/deen.xml")
          print("Local manifest XML validated.")
          PY

      - name: Sync Android source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$ANDROID_TOP"
          sync_log="$RUNNER_TEMP/repo-sync.log"
          echo "Repo version:"
          repo version
          echo "Projects declared by the resolved manifest: $(repo list | wc -l)"
          echo "Disk before source sync:"
          df -hT "$ANDROID_TOP" "$GITHUB_WORKSPACE" /
          # Four workers match the runner's usual vCPU count and the manifest's
          # sync-j setting. Retry transient network fetch failures and stop at
          # the first persistent project failure so the log identifies it.
          export GIT_TERMINAL_PROMPT=0
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
          # Keep a visible heartbeat and disk/last-project diagnostics while a
          # slow GitHub fetch is running. The grouped pipeline preserves repo's
          # exit status via pipefail.
          (
            set -o pipefail
            repo sync -c --force-sync --no-clone-bundle --no-tags \
              --jobs=4 --retry-fetches=3 --fail-fast --verbose 2>&1 | tee "$sync_log"
          ) &
          sync_pid=$!
          (
            while kill -0 "$sync_pid" 2>/dev/null; do
              sleep 60
              if kill -0 "$sync_pid" 2>/dev/null; then
                echo "::notice::repo sync heartbeat at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                df -hT "$ANDROID_TOP" "$GITHUB_WORKSPACE" / || true
                tail -n 8 "$sync_log" || true
              fi
            done
          ) &
          heartbeat_pid=$!
          set +e
          wait "$sync_pid"
          sync_status=$?
          set -e
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          if (( sync_status != 0 )); then
            echo "::error::repo sync failed with exit code ${sync_status}"
            echo "Relevant sync errors:"
            grep -Ei 'error:|fatal:|failed to|not found|no space left|RPC failed|timed out|could not resolve|connection reset|authentication failed' "$sync_log" | tail -100 || true
            echo "Disk after failed source sync:"
            df -hT "$ANDROID_TOP" "$GITHUB_WORKSPACE" /
            echo "Size of repo metadata:"
            du -sh .repo .repo/project-objects .repo/projects 2>/dev/null || true
            exit "$sync_status"
          fi
          # repo leaves synchronized projects detached at pinned commits; create
          # a local branch label for the device tree without changing its commit.
          git -C device/motorola/deen switch -C lineage-19.1
          test -s device/motorola/deen/lineage_deen.mk
          test -s vendor/motorola/deen/deen-vendor.mk
          # The LFS cache duplicates payloads already materialized in the tree.
          echo "Disk before LFS cache cleanup:"
          df -hT "$GITHUB_WORKSPACE" /
          find .repo -type d -path '*/lfs/objects' -prune -exec du -sh {} + 2>/dev/null || true
          find .repo -type d -path '*/lfs/objects' -prune -exec rm -rf {} +
          echo "Disk after LFS cache cleanup:"
          df -hT "$GITHUB_WORKSPACE" /

      - name: Upload source-sync diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deen-lineage19-sync-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/repo-sync.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends gh

      - name: Download and stage verified kernel artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$ANDROID_TOP"
          artifact_dir="$RUNNER_TEMP/deen-kernel-artifact"
          mkdir -p "$artifact_dir"

          # Stable public mirror for the successful kernel artifact.
          # It avoids both a stale numeric artifact ID and cross-repo GITHUB_TOKEN permissions.
          artifact_url="https://nightly.link/isabe8499-oss/kernel_motorola_msm8953-22/workflows/deen-kernel-build.yml/bakasu-susfs23-deen/deen-susfs23.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$artifact_url" -o "$RUNNER_TEMP/deen-kernel-artifact.zip"
          unzip -tq "$RUNNER_TEMP/deen-kernel-artifact.zip"
          unzip -q "$RUNNER_TEMP/deen-kernel-artifact.zip" -d "$artifact_dir"

          # Fail early with useful evidence if artifact layout changes.
          find "$artifact_dir" -maxdepth 5 -type f | sort | head -200
          image="$(find "$artifact_dir" -type f -path '*/out/arch/arm64/boot/Image.gz-dtb' -print -quit)"
          config="$(find "$artifact_dir" -type f -path '*/out/.config' -print -quit)"
          # The kernel workflow exports a verified copy at artifact root too.
          # Some artifact mirrors flatten or omit the hidden build output path.
          if [[ -z "$config" ]]; then
            config="$(find "$artifact_dir" -type f -name 'susfs-used.config' -print -quit)"
          fi
          headers="$(find "$artifact_dir" -type d -path '*/out/arch/arm64/boot/usr/include' -print -quit)"
          susfs_header="$(find "$artifact_dir" -type f -path '*/include/linux/susfs.h' -print -quit)"
          nomount_header="$(find "$artifact_dir" -type f -path '*/fs/nomount/nomount.h' -print -quit)"
          test -n "$image" && test -s "$image"
          if [[ -z "$config" || ! -s "$config" ]]; then
            echo "::error::Kernel artifact is missing both out/.config and susfs-used.config"
            find "$artifact_dir" -maxdepth 8 -type f -print | sort
            exit 1
          fi
          echo "Using kernel config: $config"
          test -n "$headers" && test -d "$headers"
          test -n "$susfs_header" && test -s "$susfs_header"
          test -n "$nomount_header" && test -s "$nomount_header"
          actual_sha="$(sha256sum "$image" | awk '{print $1}')"
          echo "Kernel image SHA-256: $actual_sha"
          grep -qx 'CONFIG_KSU=y' "$config"
          grep -qx 'CONFIG_KSU_SUSFS=y' "$config"
          grep -qx 'CONFIG_NOMOUNT=y' "$config"
          grep -q 'SUSFS_VERSION "v2.3.0"' "$susfs_header"
          grep -q 'NOMOUNT_BASE_VERSION "22"' "$nomount_header"

          # Stage into the exact structure required by stage-kernel.sh.
          mkdir -p "$artifact_dir/out/arch/arm64/boot/usr" "$artifact_dir/include/linux" "$artifact_dir/fs/nomount"
          [[ "$image" == "$artifact_dir/out/arch/arm64/boot/Image.gz-dtb" ]] || { mkdir -p "$artifact_dir/out/arch/arm64/boot"; cp "$image" "$artifact_dir/out/arch/arm64/boot/Image.gz-dtb"; }
          [[ "$config" == "$artifact_dir/out/.config" ]] || cp "$config" "$artifact_dir/out/.config"
          [[ "$headers" == "$artifact_dir/out/arch/arm64/boot/usr/include" ]] || { mkdir -p "$artifact_dir/out/arch/arm64/boot/usr"; cp -a "$headers" "$artifact_dir/out/arch/arm64/boot/usr/"; }
          [[ "$susfs_header" == "$artifact_dir/include/linux/susfs.h" ]] || cp "$susfs_header" "$artifact_dir/include/linux/susfs.h"
          [[ "$nomount_header" == "$artifact_dir/fs/nomount/nomount.h" ]] || cp "$nomount_header" "$artifact_dir/fs/nomount/nomount.h"

          bash device/motorola/deen/scripts/stage-kernel.sh "$artifact_dir"
          rm -rf "$artifact_dir" "$RUNNER_TEMP/deen-kernel-artifact.zip"
          echo "Kernel image and exported headers staged."
          df -hT "$GITHUB_WORKSPACE" /
      - name: Build ROM
        shell: bash
        env:
          CLEAN_BUILD: ${{ inputs.clean_build || false }}
        run: |
          # Android 12 envsetup.sh is not compatible with nounset (-u).
          set -Eeo pipefail
          cd "$ANDROID_TOP"
          build_log="$RUNNER_TEMP/lineage-build.log"
          resource_log="$RUNNER_TEMP/lineage-resource.log"
          : > "$build_log"
          : > "$resource_log"
          # Capture every command, including envsetup, lunch and the Soong
          # bootstrap. Previously m nothing ran before logging/monitoring began.
          exec > >(tee -a "$build_log") 2>&1

          snapshot_resources() {
            echo "=== Resource snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            free -h || true
            swapon --show || true
            cat /proc/pressure/memory 2>/dev/null || true
            echo "--- cgroup memory ---"
            for f in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.swap.current /sys/fs/cgroup/memory.swap.max /sys/fs/cgroup/memory/memory.failcnt /sys/fs/cgroup/memory/memory.oom_control; do
              if [[ -r "$f" ]]; then
                echo "[$f]"
                cat "$f" || true
              fi
            done
            echo "--- largest processes (RSS KiB) ---"
            ps -eo pid,ppid,comm,rss --sort=-rss | head -20 || true
            echo "--- storage ---"
            df -hT "$ANDROID_TOP" "$GITHUB_WORKSPACE" / || true
          }

          monitor_resources() {
            trap 'exit 0' TERM INT
            while sleep 30; do
              snapshot_resources >> "$resource_log" 2>&1 || true
              echo "::notice::Build resource monitor heartbeat at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              tail -n 14 "$resource_log" || true
            done
          }

          echo "Build log: $build_log"
          echo "Resource log: $resource_log"
          echo "Runner CPUs: $(nproc)"
          echo "Configured ROM parallelism: $ANDROID_JOBS"
          snapshot_resources | tee "$resource_log"
          monitor_resources &
          monitor_pid=$!
          cleanup_monitor() {
            local status=$?
            trap - EXIT
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            echo "Build shell exit status: $status"
            exit "$status"
          }
          trap cleanup_monitor EXIT

          if [[ "$CLEAN_BUILD" == "true" ]]; then
            echo "::warning::Clean build requested; removing out/."
            rm -rf out
          fi

          echo "===== Phase 1/2: environment setup and Soong bootstrap ====="
          source build/envsetup.sh
          lunch lineage_deen-userdebug
          # AOSP/Soong's final bootstrap step analyzes Android.bp and can be
          # memory-intensive. Limit Ninja to one task here; the old command
          # used the runner default and ignored ANDROID_JOBS=2.
          echo "Starting memory-constrained Soong bootstrap: m -j1 nothing"
          GOMAXPROCS=2 m -j1 nothing
          test -s out/soong/build.ninja
          echo "Soong bootstrap completed; out/soong/build.ninja exists."

          echo "===== Phase 2/2: ROM compilation ====="
          echo "Disk before build-space check:"
          du -sh .repo .repo/project-objects .repo/projects "$CCACHE_DIR" out 2>/dev/null || true
          df -hT "$ANDROID_TOP" "$GITHUB_WORKSPACE" /
          android_avail_kib="$(df --output=avail "$ANDROID_TOP" | awk 'NR==2 {print $1}')"
          workspace_avail_kib="$(df --output=avail "$GITHUB_WORKSPACE" | awk 'NR==2 {print $1}')"
          if (( workspace_avail_kib < 15 * 1024 * 1024 )); then
            echo "::warning::Less than 15 GiB remain on the metadata/cache volume; clearing ccache only (not .repo/project-objects)."
            ccache -C || true
            workspace_avail_kib="$(df --output=avail "$GITHUB_WORKSPACE" | awk 'NR==2 {print $1}')"
          fi
          if (( android_avail_kib < 30 * 1024 * 1024 )); then
            android_avail_gib=$((android_avail_kib / 1024 / 1024))
            echo "::error::Only ${android_avail_gib} GiB remain on the Android worktree/build volume. Need at least 30 GiB before compiling."
            exit 1
          fi
          if (( workspace_avail_kib < 8 * 1024 * 1024 )); then
            echo "::error::The .repo/ccache volume has less than 8 GiB free; refusing to start compilation."
            exit 1
          fi
          echo "Disk before compiling ROM:"
          df -hT "$ANDROID_TOP" "$GITHUB_WORKSPACE" /
          mka bacon -j"$ANDROID_JOBS"

      - name: Upload ROM build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deen-lineage19-build-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lineage-build.log
            ${{ runner.temp }}/lineage-resource.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify ROM ZIP exists and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          out="$ANDROID_TOP/out/target/product/deen"
          shopt -s nullglob
          zips=("$out"/*lineage*.zip "$out"/*deen*.zip)
          if (( ${#zips[@]} == 0 )); then
            echo "::error::No ROM ZIP found under $out"
            find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/rom-artifacts"
          for zip in "${zips[@]}"; do
            [[ -s "$zip" ]] && cp -v "$zip" "$GITHUB_WORKSPACE/rom-artifacts/"
          done
          test -n "$(find "$GITHUB_WORKSPACE/rom-artifacts" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          (cd "$GITHUB_WORKSPACE/rom-artifacts" && sha256sum *.zip | tee SHA256SUMS.txt)

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: deen-lineage19-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload ROM ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-deen-19.1-${{ github.sha }}
          path: |
            rom-artifacts/*.zip
            rom-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Report disk and ccache status
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -s || true
          else
            echo "ccache was not installed; earlier setup/build steps did not run."
          fi
          if [[ -n "${ANDROID_TOP:-}" && -d "${ANDROID_TOP:-/nonexistent}" ]]; then
            df -hT "$ANDROID_TOP" "$GITHUB_WORKSPACE" / || true
          else
            df -hT "$GITHUB_WORKSPACE" / || true
          fi

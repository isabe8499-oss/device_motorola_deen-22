name: Build LineageOS 19.1 for Motorola One Deen

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Remove previous build output before compiling"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - lineage-19.1
    paths:
      - ".github/workflows/build.yml"
      - "ROM_BUILD.md"
      - "scripts/build-lineage19.sh"
      - "scripts/stage-kernel.sh"
      - "lineage_deen.mk"
      - "BoardConfig.mk"
      - "device.mk"
      - "lineage.dependencies"

permissions:
  contents: read

concurrency:
  group: deen-lineage19-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile LineageOS 19.1 (deen)
    # Optional repository variable DEEN_RUNNER_LABELS may be a JSON string/array of runner labels.
    runs-on: ${{ vars.DEEN_RUNNER_LABELS != '' && fromJSON(vars.DEEN_RUNNER_LABELS) || 'ubuntu-22.04' }}
    timeout-minutes: 350
    env:
      USE_CCACHE: "1"
      CCACHE_EXEC: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      ANDROID_JOBS: "4"

    steps:
      # Must precede checkout: this action remounts the workspace volume.
      - name: Maximize available build disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 128
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          overprovision-lvm: "true"

      - name: Inspect runner resources and require usable disk
        shell: bash
        run: |
          set -euo pipefail
          df -hT
          free -h
          nproc
          avail_kib="$(df --output=avail "$GITHUB_WORKSPACE" | awk 'NR==2 {print $1}')"
          avail_gib=$((avail_kib / 1024 / 1024))
          echo "Workspace free space: ${avail_gib} GiB"
          # A best-effort shared runner can vary; require 50 GiB to proceed with a shallow sync.
          # A successful full ROM build still generally needs substantially more storage.
          if (( avail_kib < 73400320 )); then
            echo "::error::Only ${avail_gib} GiB free after cleanup; refusing to sync a large Android tree. Use a larger/self-hosted runner if this floor cannot be met."
            exit 1
          fi

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          ref: lineage-19.1
          fetch-depth: 1

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils \
            lld lzop pahole perl cpio jq pngcrush rsync schedtool squashfs-tools unzip xsltproc zip \
            zlib1g-dev python3 python-is-python3
          git lfs install

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl --fail --silent --show-error --location https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: deen-lineage19-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            deen-lineage19-ccache-${{ runner.os }}-${{ github.ref_name }}-
            deen-lineage19-ccache-${{ runner.os }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --show-config

      - name: Initialize LineageOS source using shallow sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          repo init -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 --depth=1 --git-lfs
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/deen.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="deen-github" fetch="https://github.com/" />
            <project name="isabe8499-oss/device_motorola_deen-22" path="device/motorola/deen" remote="deen-github" revision="lineage-19.1" />
            <project name="Vhmit/vendor_motorola_deen" path="vendor/motorola/deen" remote="deen-github" revision="lineage-19.1" />
            <project name="isabe8499-oss/kernel_motorola_msm8953-22" path="kernel/motorola/msm8953" remote="deen-github" revision="bakasu-susfs23-deen" />
          </manifest>
          XML
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse(".repo/local_manifests/deen.xml")
          print("Local manifest XML validated.")
          PY

      - name: Sync Android source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j2
          # repo leaves synchronized projects detached at pinned commits; the
          # device build helper checks named branch labels, so create local labels
          # at the exact commits fetched by repo sync.
          git -C device/motorola/deen switch -C lineage-19.1
          git -C kernel/motorola/msm8953 switch -C bakasu-susfs23-deen

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends gh

      - name: Stage verified kernel artifact or build kernel from source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KERNEL_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/android"
          sudo apt-get install -y --no-install-recommends gh
          kernel_dir="$GITHUB_WORKSPACE/android/kernel/motorola/msm8953"
          artifact_dir="$RUNNER_TEMP/deen-kernel-artifact"
          have_artifact=false

          # A token with Actions: read on the kernel repository can be supplied as
          # the KERNEL_REPO_TOKEN secret. The built-in GITHUB_TOKEN is repo-scoped;
          # if cross-repo artifact download is denied, compile the exact synced source.
          if gh run download 40789837157 \
              --repo isabe8499-oss/kernel_motorola_msm8953-22 \
              --name deen-susfs23-12 \
              --dir "$artifact_dir"; then
            if [[ -s "$artifact_dir/out/arch/arm64/boot/Image.gz-dtb" ]] && \
               [[ -s "$artifact_dir/out/.config" ]] && \
               [[ -d "$artifact_dir/out/arch/arm64/boot/usr/include" ]]; then
              rsync -a "$artifact_dir/out/" "$kernel_dir/out/"
              have_artifact=true
              echo "Using verified prebuilt kernel artifact."
            else
              echo "::warning::Kernel artifact downloaded, but expected image/config/headers were not all present; rebuilding kernel."
            fi
          else
            echo "::warning::Could not download the cross-repository kernel artifact; rebuilding from the synchronized kernel source."
          fi

          if [[ "$have_artifact" != "true" ]]; then
            cd "$kernel_dir"
            ksu_sha="$(git ls-remote https://github.com/Baka-SU/BakaSU.git refs/heads/main | awk 'NR==1 {print $1}')"
            [[ -n "$ksu_sha" ]] || { echo "::error::Could not resolve BakaSU main."; exit 1; }
            export KSU_DIR="$RUNNER_TEMP/bakasu"
            export TOOLCHAIN_DIR="$RUNNER_TEMP/clang"
            export KSU_REF="$ksu_sha"
            printf 'n\n' | ./build.sh deen -ksu -z
            make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCFLAGS=-fcommon \
              INSTALL_HDR_PATH="$PWD/out/arch/arm64/boot/usr" headers_install
          fi

          cd "$GITHUB_WORKSPACE/android"
          bash device/motorola/deen/scripts/stage-kernel.sh kernel/motorola/msm8953

      - name: Build ROM
        shell: bash
        env:
          CLEAN_BUILD: ${{ inputs.clean_build || false }}
        run: |
          # Android 12 / LineageOS 19.1 envsetup scripts intentionally inspect
          # optional, unset shell variables. Bash nounset (-u) aborts at TOP or
          # ZSH_VERSION before lunch can initialize the build environment.
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android"
          if [[ "$CLEAN_BUILD" == "true" ]]; then
            rm -rf out
          fi
          source build/envsetup.sh
          lunch lineage_deen-userdebug
          mka bacon -j"$ANDROID_JOBS"

      - name: Verify ROM ZIP exists and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/android/out/target/product/deen"
          shopt -s nullglob
          zips=("$out"/*lineage*.zip "$out"/*deen*.zip)
          if (( ${#zips[@]} == 0 )); then
            echo "::error::No ROM ZIP found under $out"
            find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/rom-artifacts"
          for zip in "${zips[@]}"; do
            [[ -s "$zip" ]] && cp -v "$zip" "$GITHUB_WORKSPACE/rom-artifacts/"
          done
          test -n "$(find "$GITHUB_WORKSPACE/rom-artifacts" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          (cd "$GITHUB_WORKSPACE/rom-artifacts" && sha256sum *.zip | tee SHA256SUMS.txt)

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: deen-lineage19-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload ROM ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-deen-19.1-${{ github.sha }}
          path: |
            rom-artifacts/*.zip
            rom-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Report disk and ccache status
        if: always()
        shell: bash
        run: |
          ccache -s || true
          df -hT || true

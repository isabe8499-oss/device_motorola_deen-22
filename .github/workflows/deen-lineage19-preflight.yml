name: Deen LineageOS 19.1 Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-19.1
    paths:
      - 'BoardConfig.mk'
      - 'AndroidProducts.mk'
      - 'device.mk'
      - 'lineage_deen.mk'
      - 'system.prop'
      - 'KERNEL_ROM_INTEGRATION.md'
      - 'lineage.dependencies'
      - 'extract-files.sh'
      - 'setup-makefiles.sh'
      - 'scripts/stage-kernel.sh'
      - 'scripts/build-lineage19.sh'
      - 'ROM_BUILD.md'
      - '.github/workflows/deen-lineage19-preflight.yml'
  pull_request:
    branches:
      - lineage-19.1

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Deen source dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          ref: lineage-19.1

      - name: Validate device product and boot configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^PRODUCT_DEVICE := deen$' lineage_deen.mk
          grep -q '^PRODUCT_NAME := lineage_deen$' lineage_deen.mk
          ! grep -q '^BUILD_FINGERPRINT :=.*:10/' lineage_deen.mk
          ! grep -q 'PRIVATE_BUILD_DESC=.* 10 ' lineage_deen.mk
          grep -q '^TARGET_BOARD_PLATFORM := msm8953$' BoardConfig.mk
          grep -q '^BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb$' BoardConfig.mk
          grep -q '^BOARD_BOOT_HEADER_VERSION := 1$' BoardConfig.mk
          grep -q 'LOCAL_KERNEL := device/motorola/deen-kernel/Image.gz-dtb' device.mk
          bash -n extract-files.sh
          bash -n setup-makefiles.sh
          bash -n scripts/stage-kernel.sh
          bash -n scripts/build-lineage19.sh
          echo "Device identity, Android 12 fingerprint policy, boot settings, and shell scripts passed static checks."

      - name: Validate dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          deps = json.loads(Path("lineage.dependencies").read_text())
          vendor = [x for x in deps if x.get("target_path") == "vendor/motorola/deen"]
          kernel = [x for x in deps if x.get("target_path") == "kernel/motorola/msm8953"]
          assert len(vendor) == 1, "Expected one vendor/motorola/deen dependency"
          assert vendor[0].get("repository") == "Vhmit/vendor_motorola_deen"
          assert vendor[0].get("branch") == "lineage-19.1"
          assert len(kernel) == 1, "Expected one kernel/motorola/msm8953 dependency"
          assert kernel[0].get("repository") == "isabe8499-oss/kernel_motorola_msm8953-22"
          assert kernel[0].get("branch") == "bakasu-susfs23-deen"
          print("Vendor and kernel dependency manifest is valid.")
          PY

      - name: Validate full ROM build recipe and local manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          doc = Path("ROM_BUILD.md").read_text()
          match = re.search(r"cat > \.repo/local_manifests/deen\.xml <<'XML'\n(.*?)\nXML", doc, re.S)
          assert match, "Local manifest XML block missing from ROM_BUILD.md"
          root = ET.fromstring(match.group(1))
          remotes = {x.get("name"): x.get("fetch") for x in root.findall("remote")}
          assert remotes.get("deen-github") == "https://github.com/"
          projects = {x.get("path"): x for x in root.findall("project")}
          expected = {
              "device/motorola/deen": ("isabe8499-oss/device_motorola_deen-22", "lineage-19.1"),
              "vendor/motorola/deen": ("Vhmit/vendor_motorola_deen", "lineage-19.1"),
              "kernel/motorola/msm8953": ("isabe8499-oss/kernel_motorola_msm8953-22", "bakasu-susfs23-deen"),
          }
          for path, (name, revision) in expected.items():
              p = projects.get(path)
              assert p is not None, f"Missing manifest project: {path}"
              assert p.get("name") == name and p.get("revision") == revision, f"Incorrect pin for {path}"
              assert p.get("remote") == "deen-github", f"Incorrect remote for {path}"

          build = Path("scripts/build-lineage19.sh").read_text()
          for marker in ("lunch lineage_deen-userdebug", "mka bacon", "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y", "CONFIG_NOMOUNT=y"):
              assert marker in build, f"ROM build helper is missing required marker: {marker}"
          stage = Path("scripts/stage-kernel.sh").read_text()
          assert "Image.gz-dtb" in stage and "kernel-headers" in stage
          print("Local manifest XML, repository pins, kernel staging, and full-build command validated.")
          PY

      - name: Verify vendor and kernel branches exist
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads https://github.com/Vhmit/vendor_motorola_deen.git refs/heads/lineage-19.1
          git ls-remote --exit-code --heads https://github.com/isabe8499-oss/kernel_motorola_msm8953-22.git refs/heads/bakasu-susfs23-deen

      - name: Verify kernel version, NoMount and SUSFS build inputs
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/isabe8499-oss/kernel_motorola_msm8953-22/bakasu-susfs23-deen"
          curl --fail --silent --show-error --location "$base/Makefile" -o "$RUNNER_TEMP/kernel-Makefile"
          grep -qx 'VERSION = 4' "$RUNNER_TEMP/kernel-Makefile"
          grep -qx 'PATCHLEVEL = 19' "$RUNNER_TEMP/kernel-Makefile"
          grep -qx 'SUBLEVEL = 325' "$RUNNER_TEMP/kernel-Makefile"

          curl --fail --silent --show-error --location "$base/arch/arm64/configs/vendor/deen_defconfig" -o "$RUNNER_TEMP/deen_defconfig"
          grep -q '^CONFIG_ARCH_MSM8953=y$' "$RUNNER_TEMP/deen_defconfig"
          grep -q '^CONFIG_KEYS=y$' "$RUNNER_TEMP/deen_defconfig"
          grep -q '^CONFIG_NOMOUNT=y$' "$RUNNER_TEMP/deen_defconfig"

          curl --fail --silent --show-error --location "$base/patches/susfs-v2.3.0-4.19.patch" -o "$RUNNER_TEMP/susfs.patch"
          curl --fail --silent --show-error --location "$base/patches/bakasu-susfs-v2.3.0-inline-hooks.patch" -o "$RUNNER_TEMP/bakasu-susfs.patch"
          curl --fail --silent --show-error --location "$base/patches/susfs-v2.3.0.config" -o "$RUNNER_TEMP/susfs.config"
          curl --fail --silent --show-error --location "$base/build.sh" -o "$RUNNER_TEMP/kernel-build.sh"
          curl --fail --silent --show-error --location "$base/fs/nomount/nomount.h" -o "$RUNNER_TEMP/nomount.h"

          grep -q '^CONFIG_KSU_SUSFS=y$' "$RUNNER_TEMP/susfs.config"
          grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y$' "$RUNNER_TEMP/susfs.config"
          grep -q 'apply_susfs_patches' "$RUNNER_TEMP/kernel-build.sh"
          grep -q 'NOMOUNT_BASE_VERSION "22"' "$RUNNER_TEMP/nomount.h"
          test -s "$RUNNER_TEMP/susfs.patch"
          test -s "$RUNNER_TEMP/bakasu-susfs.patch"
          echo "Linux 4.19.325, NoMount v22, and SUSFS 2.3.0 inputs verified."

      - name: Verify successful kernel artifact matches current source revision
        shell: bash
        run: |
          set -euo pipefail
          repo="isabe8499-oss/kernel_motorola_msm8953-22"
          branch="bakasu-susfs23-deen"
          workflow="deen-kernel-build.yml"
          api="https://api.github.com/repos/$repo"

          source_sha="$(git ls-remote "https://github.com/$repo.git" "refs/heads/$branch" | awk 'NR==1 {print $1}')"
          test -n "$source_sha"

          curl --fail --silent --show-error --location \
            "$api/actions/workflows/$workflow/runs?branch=$branch&status=success&per_page=20" \
            -H 'Accept: application/vnd.github+json' -o "$RUNNER_TEMP/kernel-runs.json"

          run_id="$(python3 - "$RUNNER_TEMP/kernel-runs.json" "$source_sha" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          sha = sys.argv[2]
          runs = [r for r in data.get("workflow_runs", [])
                  if r.get("head_sha") == sha and r.get("conclusion") == "success"]
          if not runs:
              raise SystemExit("No successful kernel build exists for the current kernel branch HEAD: " + sha)
          print(max(runs, key=lambda r: r.get("run_number", 0))["id"])
          PY
          )"

          curl --fail --silent --show-error --location \
            "$api/actions/runs/$run_id/artifacts" \
            -H 'Accept: application/vnd.github+json' -o "$RUNNER_TEMP/kernel-artifacts.json"

          python3 - "$RUNNER_TEMP/kernel-artifacts.json" "$run_id" "$source_sha" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          run_id, sha = sys.argv[2], sys.argv[3]
          artifacts = [a for a in data.get("artifacts", [])
                       if (a.get("name") == "deen-susfs23"
                           or a.get("name", "").startswith("deen-susfs23-"))
                       and not a.get("expired", True)
                       and a.get("size_in_bytes", 0) > 0]
          if not artifacts:
              raise SystemExit("Successful kernel build has no unexpired non-empty deen-susfs23 artifact.")
          print(f"Kernel source HEAD: {sha}")
          print(f"Matching successful workflow run: {run_id}")
          print("Available kernel artifact(s): " + ", ".join(a["name"] for a in artifacts))
          PY

      - name: Report integration boundary
        shell: bash
        run: |
          echo "::notice::This preflight validates source metadata, build inputs, and the matching kernel artifact; it does not compile Android or prove device boot."
          echo "::notice::The ROM tree expects a staged Image.gz-dtb and exported headers before the ROM build."
